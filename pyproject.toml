[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-api-explorer"
version = "0.1.0"
description = "Local-first hidden API inventory and authorization comparison demo"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "esprima>=4.0.1"]

[tool.setuptools.packages.find]
include = ["demo_app*", "explorer*"]

[tool.setuptools.package-data]
demo_app = ["openapi.json", "static/*.js"]

[tool.ruff]
line-length = 100
